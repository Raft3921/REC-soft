<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-src 'none'"><title>REC soft</title><link rel="stylesheet" href="styles.css"></head>
<body><main>
  <header><span class="logo-dot"></span><span id="updateBadge" class="badge">更新確認中</span></header>
  <section class="panel">
    <div class="field-row"><label><span>録画する画面</span><select id="source"></select></label><button id="refresh" class="secondary">再読込</button></div>
    <div id="preview" class="preview"><span>画面を選択してください</span></div>
    <div class="grid">
      <label><span>フレームレート</span><select id="fps"><option value="60" selected>60 fps</option><option value="30">30 fps</option></select></label>
      <label><span>画質</span><select id="quality"><option value="18000000">高画質・18 Mbps</option><option value="10000000" selected>標準・10 Mbps</option><option value="6000000">軽量・6 Mbps</option></select></label>
      <label class="toggle"><input id="systemAudio" type="checkbox" checked><span id="systemAudioLabel">PCの音声</span></label>
      <label class="toggle"><input id="micAudio" type="checkbox" checked><span>マイク</span></label>
    </div>
    <div class="folder-row"><div><span>保存先</span><strong id="folder">ビデオ フォルダー</strong></div><button id="chooseFolder" class="secondary">変更</button></div>
    <div id="status" class="status">準備完了</div>
    <button id="record" class="record"><span></span><b>録画を開始</b></button>
    <button id="openResult" class="secondary full" hidden>保存したファイルを表示</button>
  </section>
</main><script src="renderer.js"></script></body></html>
